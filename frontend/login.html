<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · NLP Text Summarizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<header class="navbar">
  <div class="navbar__inner">
    <a href="index.html" class="brand">
      <span class="brand__mark">⟨NLP⟩</span> Text Summarizer
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="auth-page">
  <div class="container auth-page__inner">
    <div class="auth-card card">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in</h1>
      <p class="auth-card__desc">Log in to reach your summarization dashboard.</p>

      <div id="formAlert" class="alert alert--error" role="alert"></div>
      <div id="infoAlert" class="alert alert--success" role="status"></div>

      <form id="loginForm" novalidate>
        <div class="form-field">
          <label for="identifier">Email or username</label>
          <input type="text" id="identifier" name="identifier" autocomplete="username" required>
          <span class="field-error" id="identifierError"></span>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <span class="field-error" id="passwordError"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">Login</button>
      </form>

      <p class="auth-card__switch">
        Don't have an account? <a href="register.html">Create account</a>
      </p>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container footer__inner">
    <span class="brand"><span class="brand__mark">⟨NLP⟩</span> Text Summarizer</span>
    <p class="footer__note">Built with NLTK, spaCy &amp; FastAPI — a college NLP project.</p>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/login.js"></script>
</body>
</html>
